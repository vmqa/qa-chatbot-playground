<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Pipeline Carousel — Slide 1 of 6</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 675px;
    background: #0a0f1e;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(37,99,235,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37,99,235,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .blob { position: absolute; border-radius: 50%; filter: blur(100px); pointer-events: none; }
  .blob-1 { width: 600px; height: 600px; background: rgba(37,99,235,0.22); top: -200px; left: -150px; }
  .blob-2 { width: 400px; height: 400px; background: rgba(124,58,237,0.16); bottom: -100px; right: -80px; }
  .blob-3 { width: 250px; height: 250px; background: rgba(6,182,212,0.1); top: 80px; right: 200px; }

  .canvas {
    position: relative;
    width: 1200px;
    height: 675px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 80px;
    z-index: 1;
    gap: 0;
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: #3b82f6;
    margin-bottom: 28px;
    text-align: center;
  }

  .icons-row {
    font-size: 36px;
    margin-bottom: 20px;
    letter-spacing: 8px;
  }

  .hero-title {
    font-size: 52px;
    font-weight: 900;
    color: #f1f5f9;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .hero-title .arrow { color: #3b82f6; }
  .hero-title .highlight { color: #60a5fa; }

  .hero-title-sub {
    font-size: 38px;
    font-weight: 800;
    color: #94a3b8;
    text-align: center;
    margin-bottom: 22px;
  }

  .hero-sub {
    font-size: 15px;
    color: #64748b;
    text-align: center;
    line-height: 1.6;
    max-width: 620px;
    margin-bottom: 32px;
  }

  .pills-row {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(15,23,42,0.9);
    border: 1px solid rgba(51,65,85,0.6);
    border-radius: 24px;
    padding: 8px 18px;
    font-size: 11px;
    font-weight: 600;
    color: #94a3b8;
    letter-spacing: 0.3px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .slide-num {
    position: absolute;
    bottom: 24px;
    right: 48px;
    font-size: 11px;
    font-weight: 700;
    color: #1e293b;
    letter-spacing: 1.5px;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="canvas">

  <div class="eyebrow">AI-Powered Development Pipeline</div>

  <div class="icons-row">🤖 &thinsp;⚡</div>

  <div class="hero-title">
    From Requirement <span class="arrow">→</span> <span class="highlight">Pull Request</span>
  </div>
  <div class="hero-title-sub">in Minutes</div>

  <div class="hero-sub">
    Automate planning, coding, and testing with AI.<br>
    Human review stays in control.
  </div>

  <div class="pills-row">
    <div class="pill"><span class="dot" style="background:#34d399"></span>No extra infrastructure</div>
    <div class="pill"><span class="dot" style="background:#60a5fa"></span>~3 min end-to-end</div>
    <div class="pill"><span class="dot" style="background:#a78bfa"></span>Human approval required</div>
  </div>

</div>

<div class="slide-num">1 / 6</div>

</body>
</html>
